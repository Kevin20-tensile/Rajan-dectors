<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f8f9fa;
    padding:50px 20px;
}

.gallery-section{
    max-width:1200px;
    margin:auto;
    text-align:center;
}

.gallery-section h2{
    font-size:38px;
    color:#222;
    margin-bottom:10px;
}

.heading-line{
    width:100px;
    height:4px;
    background:#00a8ff;
    margin:0 auto 30px;
    border-radius:10px;
}

/* Buttons */
.filter-buttons{
    margin-bottom:40px;
}

.filter-buttons button{
    padding:12px 25px;
    margin:5px;
    border:none;
    border-radius:30px;
    background:#e5e5e5;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.filter-buttons button:hover,
.filter-buttons button.active{
    background:#00a8ff;
    color:white;
}

/* Gallery */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.gallery-item{
    break-inside: avoid;
    width: 100%;
    display: none;
}

.gallery-item img{
    width:100%;
    height: 300px;
    object-fit:cover;
    border-radius: 12px;
    cursor: pointer;
    display: block;
}

.gallery-item img:hover{
    transform:scale(1.08);
}

.lightbox{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    z-index:9999;
    justify-content:center;
    align-items:center;
}

.lightbox img{
    width: 95vw;
    height: 95vh;
    object-fit: contain;
}

.close-btn{
    position:absolute;
    top:20px;
    right:30px;
    color:white;
    font-size:40px;
    cursor:pointer;
}
.image-box{
    position:relative;
    overflow:hidden;
    border-radius:12px;
}

.image-box img{
    width:100%;
    height:300px;
    object-fit:cover;
    transition:0.5s ease;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    transition:0.5s ease;
    pointer-events: none;
}

.overlay i{
    color:white;
    font-size:40px;
}
.overlay p{
    color: white;
    margin-top: 10px;
    font-size: 16px;
}

.image-box:hover img{
    transform:scale(1.1);
}

.image-box:hover .overlay{
    opacity:1;
}
</style>

<script>

function filterSelection(category){

    let items = document.getElementsByClassName("gallery-item");

    for(let i=0;i<items.length;i++){
        items[i].style.display = "none";
    }

    if(category !== ""){
        for(let i=0;i<items.length;i++){

            if(category === "all"){
                items[i].style.display = "block";
            }
            else 
            if(items[i].classList.contains(category)){
                items[i].style.display = "block";
            }
        }
    }

    let btns = document.querySelectorAll(".filter-buttons button");
    btns.forEach(btn => btn.classList.remove("active"));

    event.target.classList.add("active");
}

</script>

<script>
function openImage(src){
    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightbox-img").src=src;
}

function closeImage(){
    document.getElementById("lightbox").style.display="none";
}
</script>

<div id="lightbox" class="lightbox">
    <span class="close-btn" onclick="closeImage()">&times;</span>
